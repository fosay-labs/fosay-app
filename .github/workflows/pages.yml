name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/docs/**
      - packages/sdk/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build static export and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the docs show each page's last-updated date from git history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/web
        env:
          FOSAY_STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Set the repository variable FOSAY_API_URL to the hosted API (see docs/HOSTING.md)
          NEXT_PUBLIC_API_URL: ${{ vars.FOSAY_API_URL || 'https://fosay-api.onrender.com' }}
        run: pnpm build
      - name: Build docs into /docs
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/docs/
        run: |
          pnpm --filter @fosay/docs build
          cp -r apps/docs/.vitepress/dist apps/web/out/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
